<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 580" role="img" aria-label="Deadline budget propagation: the inbound gRPC deadline is spent across every hop &#8212; connection checkout, PostgreSQL statement_timeout derived from time remaining, and the outbound tax-service call &#8212; failing fast when the budget is exhausted">
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8e1d3" stroke-width="0.5"/></pattern><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d2d2d"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect width="1150" height="580" fill="#fdfbf7"/>
<rect width="1150" height="580" fill="url(#grid)" opacity="0.5"/>
<rect x="620" y="110" width="495" height="340" rx="6" fill="#fbfaf6" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<text x="632" y="128" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#444" font-style="italic">External hops — each re-derives its own slice of the budget</text>
<rect x="25" y="245" width="165" height="90" rx="6" fill="#e8f0fb" stroke="#4a73b8" stroke-width="1.5"/>
<text x="107.5" y="288.0" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Inbound gRPC request</text>
<text x="107.5" y="305.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#4a73b8" text-anchor="middle">deadline: now + 800ms</text>
<rect x="225" y="245" width="175" height="90" rx="6" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.5"/>
<text x="312.5" y="288.0" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">pricing-svc handler</text>
<text x="312.5" y="305.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#2d2d2d" text-anchor="middle">budget = deadline - now</text>
<rect x="435" y="245" width="165" height="90" rx="6" fill="#e8f0fb" stroke="#4a73b8" stroke-width="1.5"/>
<text x="517.5" y="288.0" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Connection checkout</text>
<text x="517.5" y="305.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#4a73b8" text-anchor="middle">budget = time remaining</text>
<rect x="650" y="140" width="230" height="90" rx="6" fill="#faf0e6" stroke="#a06030" stroke-width="1.5"/>
<text x="765.0" y="183.0" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">PostgreSQL lookup</text>
<text x="765.0" y="200.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a06030" text-anchor="middle">statement_timeout = remaining</text>
<rect x="650" y="350" width="230" height="90" rx="6" fill="#faf0e6" stroke="#a06030" stroke-width="1.5"/>
<text x="765.0" y="393.0" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">tax-svc gRPC call (outbound)</text>
<text x="765.0" y="410.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a06030" text-anchor="middle">deadline = now + remaining</text>
<rect x="935" y="245" width="180" height="90" rx="6" fill="#d8e8df" stroke="#5a8870" stroke-width="1.5"/>
<text x="1025.0" y="288.0" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Compose reply</text>
<text x="1025.0" y="305.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5a8870" text-anchor="middle">return before deadline</text>
<rect x="435" y="480" width="445" height="80" rx="6" fill="#fef3f0" stroke="#c0392b" stroke-width="1.5"/>
<text x="657.5" y="518.0" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Fail fast — budget exhausted</text>
<text x="657.5" y="535.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c0392b" text-anchor="middle">return DEADLINE_EXCEEDED, skip the call</text>
<path d="M190,290.0 L225,290.0" fill="none" stroke="#2d2d2d" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M400,290.0 L435,290.0" fill="none" stroke="#2d2d2d" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M600,260 L650,185.0" fill="none" stroke="#2d2d2d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="615.0" y="200.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle" font-style="italic">budget = time remaining</text>
<text x="615.0" y="200.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#2d2d2d" text-anchor="middle" font-style="italic" font-weight="700">budget = time remaining</text>
<path d="M600,320 L650,395.0" fill="none" stroke="#2d2d2d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="615.0" y="379.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle" font-style="italic">budget = time remaining</text>
<text x="615.0" y="379.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#2d2d2d" text-anchor="middle" font-style="italic" font-weight="700">budget = time remaining</text>
<path d="M880,185.0 L935,260" fill="none" stroke="#2d2d2d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="913.5" y="216.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle" font-style="italic">rows</text>
<text x="913.5" y="216.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#2d2d2d" text-anchor="middle" font-style="italic" font-weight="700">rows</text>
<path d="M880,395.0 L935,320" fill="none" stroke="#2d2d2d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="913.5" y="351.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle" font-style="italic">tax quote</text>
<text x="913.5" y="351.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#2d2d2d" text-anchor="middle" font-style="italic" font-weight="700">tax quote</text>
<path d="M312.5,335 L312.5,480" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="367.5" y="417.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle" font-style="italic">budget &lt;= 0</text>
<text x="367.5" y="417.5" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic" font-weight="700">budget &lt;= 0</text>
<path d="M517.5,335 L517.5,480" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="575" y="34" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Deadline budget propagation across hops</text>
<text x="575" y="54" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Each hop spends from the same inbound deadline, then re-derives its own timeout from what&#x27;s left</text>
</svg>